name: ci

on:
  push:
    branches: [main]
    tags: ["node-v*", "cli-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    # Tag node-vX.Y.Z → publish @sitecommand/node; tag cli-vX.Y.Z → publish the sitecommand CLI. With npm provenance.
    if: startsWith(github.ref, 'refs/tags/node-v') || startsWith(github.ref, 'refs/tags/cli-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Which package
        id: pkg
        run: |
          if [[ "$GITHUB_REF_NAME" == node-v* ]]; then echo "dir=packages/node" >> "$GITHUB_OUTPUT"; echo "prefix=node-v" >> "$GITHUB_OUTPUT"; else echo "dir=packages/cli" >> "$GITHUB_OUTPUT"; echo "prefix=cli-v" >> "$GITHUB_OUTPUT"; fi
      - name: Version matches the tag
        run: test "${{ steps.pkg.outputs.prefix }}$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run build -w ./${{ steps.pkg.outputs.dir }}
      - run: npm publish -w ./${{ steps.pkg.outputs.dir }} --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
