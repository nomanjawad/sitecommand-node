name: ci

on:
  push:
    branches: [main]
    tags: ["node-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    # Tag node-vX.Y.Z on main → publish @sitecommand/node X.Y.Z with npm provenance.
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Version matches the tag
        run: test "node-v$(node -p "require('./packages/node/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run build -w @sitecommand/node
      - run: npm publish -w @sitecommand/node --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
